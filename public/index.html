<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e5efe6">
  <meta name="description" content="Luma — маленький синтезатор для больших мечтаний. Играй, меняй звук и следуй за светом.">
  <title>Luma — маленький синтезатор</title>
  <link rel="stylesheet" href="../app/assets/stylesheets/application.css">
  <script src="../app/javascript/tunes/settings.js" defer></script>
  <script src="../app/javascript/control_components/Slider.js" defer></script>
  <script src="../app/javascript/packs/application.js" defer></script>
</head>
<body>
  <div class="page">
    <main>
      <div class="universe-label"><span class="dot"></span>Твоя маленькая&nbsp;&nbsp;вселенная</div>
      <section class="synth" aria-label="Синтезатор">
        <div class="melody-choice" aria-label="Основная мелодия">
          <div class="melody-title"><span>1</span><strong>Основная мелодия</strong></div>
          <div class="melody-buttons"><button data-melody="light" class="selected" aria-pressed="true">Свет</button><button data-melody="vacuum" aria-pressed="false">Вакуум</button></div>
        </div>
        <div class="panels">
          <section class="sound panel"><div class="panel-heading"><h2><span>2</span>Тембр дорожки</h2></div><div class="presets"><button data-preset="air" class="selected" aria-pressed="true">Воздух</button><button data-preset="water" aria-pressed="false">Вода</button><button data-preset="earth" aria-pressed="false">Земля</button></div><div class="small-label">Форма волны</div><div class="waves"><button data-wave="sine" class="selected" aria-pressed="true"><svg viewBox="0 0 60 24"><path d="M2 12 Q9 -7 16 12 T30 12 T44 12 T58 12"/></svg><span>Плавная</span></button><button data-wave="triangle" aria-pressed="false"><svg viewBox="0 0 60 24"><path d="M2 18 L15 4 30 20 45 4 58 18"/></svg><span>Мягкая</span></button><button data-wave="square" aria-pressed="false"><svg viewBox="0 0 60 24"><path d="M2 20 V4 H17 V20 H32 V4 H47 V20 H58"/></svg><span>Яркая</span></button></div><div class="slider"><label for="volume">Громкость <output id="volume-value">45%</output></label><div class="track"><input id="volume" type="range" min="0" max="100" value="45"></div></div></section>
          <section class="space panel"><div class="panel-heading"><h2><span>3</span>Пространство</h2></div><div class="slider"><label for="echo">Эхо <output id="echo-value">30%</output></label><div class="track"><input id="echo" type="range" min="0" max="75" value="30"></div></div><div class="slider"><label for="tone">Чистота <output id="tone-value">60%</output></label><div class="track"><input id="tone" type="range" min="0" max="100" value="60"></div></div><div class="slider"><label for="release">Послезвучие <output id="release-value">1.5 с</output></label><div class="track"><input id="release" type="range" min="0.1" max="3" step="0.1" value="1.5"></div></div></section>
          <section class="sky panel"><div class="panel-heading"><h2><span>4</span>Твоя орбита</h2></div><div class="orb"><div class="system-glow"></div><div class="orbit"></div><div class="orbit orbit-two"></div><div class="planet system-core"></div><span class="system-dot dot-one"></span><span class="system-dot dot-two"></span><canvas id="wave" aria-label="Визуализация звука"></canvas></div><span id="note-name" class="visually-hidden">Свет · твоя орбита</span></section>
        </div>
        <section class="mixer" aria-label="Дорожки">
          <div class="section-title"><h2><span>5</span>Собери свой звук</h2></div>
          <div class="channels" id="channels"></div>
        </section>
        <section class="envelope" aria-label="Настройки выбранной дорожки">
          <div class="section-title"><h2><span>6</span><b id="edit-title">Мелодия / движение звука</b></h2></div>
          <div class="envelope-sliders" id="envelope-sliders"></div>
        </section>
        <section class="rhythm" aria-label="Секвенсор ударных">
          <div class="section-title"><h2><span>7</span>Нарисуй ритм</h2></div>
          <div class="grid-scroll"><div id="rhythm-grid"></div></div>
        </section>
        <div class="transport"><button id="play" aria-pressed="false"><span id="play-icon">▶</span><span id="play-text">Запустить</span></button><div class="slider tempo"><label for="tempo">Темп <output id="tempo-value">105 BPM</output></label><div class="track"><input id="tempo" type="range" min="60" max="180" value="105"></div></div><span id="position">01 / 16</span><button id="reset" aria-label="Начать заново"><span>Начать заново</span></button></div>
      </section>
    </main>
  </div>
</body>
</html>
